<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Nexa</title>
    <style>
        :root { color-scheme:light; --ink:#251b37; --muted:#766b88; --paper:#f8f7fc; --card:#fff; --line:#ebe7f2; --accent:#7651d4; --green:#7651d4; }
        * { box-sizing:border-box; }
        body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; color:var(--ink); background:radial-gradient(ellipse at 90% 0%,#eee7fb 0,transparent 34%),var(--paper); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
        main { width:min(100%,420px); }
        .brand { display:flex; align-items:center; gap:11px; margin-bottom:34px; font:700 18px Arial,sans-serif; letter-spacing:.04em; }
        .brand-mark { width:28px; height:28px; display:grid; place-items:center; border-radius:50%; background:linear-gradient(145deg,#9270e8,#6842c4); box-shadow:0 5px 14px #7651d433; color:#fff; }
        .eyebrow { color:var(--accent); font:700 12px Arial,sans-serif; letter-spacing:.12em; text-transform:uppercase; }
        h1 { margin:10px 0; font-size:42px; font-weight:400; }
        .intro { margin:0 0 25px; color:var(--muted); font:15px/1.5 Arial,sans-serif; }
        form { padding:26px; border:1px solid var(--line); border-radius:18px; background:var(--card); box-shadow:0 12px 38px #38215d0d; }
        label { display:block; margin:0 0 7px; font:700 13px Arial,sans-serif; }
        input { width:100%; min-height:44px; margin-bottom:18px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); font:15px Arial,sans-serif; }
        input:focus { outline:3px solid #7651d433; border-color:var(--accent); outline-offset:1px; }
        button { width:100%; min-height:46px; border:0; border-radius:10px; background:linear-gradient(135deg,#805cdd,#6842c4); color:#fff; cursor:pointer; font:700 14px Arial,sans-serif; box-shadow:0 5px 14px #7651d426; }
        button:hover { background:linear-gradient(135deg,#704bd0,#5935b5); }
        .password-field { position:relative; margin-bottom:18px; }
        .password-field input { margin-bottom:0; padding-right:48px; }
        .toggle-password { position:absolute; top:50%; right:5px; width:36px; min-height:36px; display:grid; place-items:center; padding:0; transform:translateY(-50%); border-radius:4px; background:transparent; color:var(--muted); }
        .toggle-password:hover { background:#f0ede5; color:var(--ink); }
        .toggle-password svg { width:20px; height:20px; }
        .message { margin:0 0 16px; padding:12px; border:1px solid #e7def8; border-left:3px solid var(--accent); border-radius:10px; background:#faf8ff; color:#55436f; font:13px/1.5 Arial,sans-serif; }
        .notice { margin-top:14px; color:var(--muted); font:12px/1.5 Arial,sans-serif; }
        * { scrollbar-width:thin; scrollbar-color:#c8b8e9 #f4f1f9; }
        *::-webkit-scrollbar { width:10px; height:10px; }
        *::-webkit-scrollbar-track { background:#f4f1f9; border-radius:999px; }
        *::-webkit-scrollbar-thumb { background:#c8b8e9; border:2px solid #f4f1f9; border-radius:999px; }
        *::-webkit-scrollbar-thumb:hover { background:#a88edb; }
        @media (max-width:480px) { h1 { font-size:36px; } form { padding:20px; } }
    </style>
</head>
<body>
    <main>
        <div class="brand"><span class="brand-mark">N</span> NEXA</div>
        <div class="eyebrow">Acesso reservado</div>
        <h1>Entre na sua conta.</h1>
        <p class="intro">Use as credenciais configuradas para este projeto.</p>
        <form method="post" action="{{ url_for('login') }}">
            {% if erro %}<p class="message" role="alert">{{ erro }}</p>{% endif %}
            <label for="usuario">Usuário</label>
            <input id="usuario" name="usuario" type="text" autocomplete="username" required autofocus>
            <label for="senha">Senha</label>
            <div class="password-field">
                <input id="senha" name="senha" type="password" autocomplete="current-password" required>
                <button class="toggle-password" id="toggle-senha" type="button" aria-label="Mostrar senha" aria-pressed="false" title="Mostrar senha">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"></path>
                        <circle cx="12" cy="12" r="2.5"></circle>
                        <path id="olho-riscado" d="m4 4 16 16" hidden></path>
                    </svg>
                </button>
            </div>
            <button type="submit">Entrar</button>
            {% if aviso %}<p class="notice">{{ aviso }}</p>{% endif %}
        </form>
    </main>
    <script>
        const senha = document.getElementById('senha');
        const alternarSenha = document.getElementById('toggle-senha');
        const olhoRiscado = document.getElementById('olho-riscado');

        alternarSenha.addEventListener('click', () => {
            const mostrar = senha.type === 'password';
            senha.type = mostrar ? 'text' : 'password';
            alternarSenha.setAttribute('aria-pressed', String(mostrar));
            alternarSenha.setAttribute('aria-label', mostrar ? 'Ocultar senha' : 'Mostrar senha');
            alternarSenha.title = mostrar ? 'Ocultar senha' : 'Mostrar senha';
            olhoRiscado.hidden = !mostrar;
        });
    </script>
</body>
</html>
